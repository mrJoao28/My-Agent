name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
  workflow_dispatch:
    inputs:
      docker_integration:
        description: Executar integração Docker real no Linux
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docker:
    if: github.event_name == 'workflow_dispatch' && inputs.docker_integration
    runs-on: ubuntu-latest
    env:
      MYAGENT_TEST_DOCKER_IMAGE: alpine:3
      MYAGENT_TEST_SERVER_SENTINEL: fictitious-host-value
    steps:
      - uses: actions/checkout@v4
      - name: Instalar toolchain fixada
        shell: bash
        run: |
          version=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal
      - name: Preparar imagem de integração
        run: docker pull alpine:3
      - name: Executar integração Docker explicitamente
        run: cargo test --locked -p myagent-tools --test docker_real -- --ignored --nocapture
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Instalar toolchain fixada
        shell: bash
        run: |
          version=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$version"
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
      - name: Conferir formatação
        run: cargo fmt --all --check
      - name: Conferir workspace
        run: cargo check --locked --workspace --all-targets
      - name: Executar Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Executar testes
        run: cargo test --locked --workspace
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Testar automação e launcher npm sem publicação
        run: node --test scripts/npm/launcher.test.mjs scripts/npm/auto-release.test.mjs scripts/npm/trust.test.mjs
      - name: Conferir ajuda e versão do binário
        run: |
          cargo run --locked -p myagent-cli --bin myagent -- --help
          cargo run --locked -p myagent-cli --bin myagent -- --version
