[workspace]
members = [
    "crates/protocol",
    "crates/platform",
    "crates/core",
    "crates/providers",
    "crates/tools",
    "crates/sandbox",
    "crates/store",
    "crates/tui",
    "crates/cli",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/mrJoao28/My-Agent"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled", "limits"] }
thiserror = "2.0"
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context"] }
tempfile = "3.0"
myagent-protocol = { path = "crates/protocol" }
myagent-platform = { path = "crates/platform" }
myagent-core = { path = "crates/core" }
myagent-providers = { path = "crates/providers" }
myagent-tools = { path = "crates/tools" }
myagent-sandbox = { path = "crates/sandbox" }
myagent-store = { path = "crates/store" }
myagent-tui = { path = "crates/tui" }

[workspace.lints.rust]
unsafe_code = "forbid"
