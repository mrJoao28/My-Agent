[package]
name = "myagent-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Consulta mínima de ChangeTime do Windows para checkpoints verificáveis."

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Exceção isolada: a API estável std não expõe ChangeTime no Windows.
# Somente o módulo FFI documentado pode permitir unsafe.
[lints.rust]
unsafe_code = "deny"
