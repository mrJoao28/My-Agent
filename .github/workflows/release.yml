name: Distribuição npm

on:
  pull_request:
    paths:
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'npm/**'
      - 'scripts/npm/**'
      - '.github/workflows/release.yml'
      - 'LICENSE'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'npm/**'
      - 'scripts/npm/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/ci.yml'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      publish:
        description: Preparar e publicar uma release (exige NPM_AUTO_RELEASE=true)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  authorize:
    # Exchange OIDC for all six packages before making any commit/tag or build.
    if: >-
      github.repository == 'mrJoao28/My-Agent' &&
      ((github.ref == 'refs/heads/main' && vars.NPM_AUTO_RELEASE == 'true' &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))) ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Testar diagnóstico sem usar credenciais reais
        run: node --test scripts/npm/trust.test.mjs
      - name: Validar os seis cadastros Trusted Publisher
        env:
          NPM_AUTO_RELEASE: ${{ vars.NPM_AUTO_RELEASE }}
          REQUEST_PUBLISH: ${{ inputs.publish || false }}
        run: node scripts/npm/trust.mjs

  prepare:
    needs: authorize
    # A single activation switch, after npm/environment setup. PRs never write.
    if: >-
      github.repository == 'mrJoao28/My-Agent' &&
      needs.authorize.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      vars.NPM_AUTO_RELEASE == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Testar a preparação antes de alterar versões/tags
        run: node --test scripts/npm/auto-release.test.mjs
      - id: release
        name: Sincronizar versão e enviar commit/tag atomicamente
        env:
          NPM_AUTO_RELEASE: ${{ vars.NPM_AUTO_RELEASE }}
          REQUEST_PUBLISH: ${{ inputs.publish || false }}
        run: node scripts/npm/auto-release.mjs

  validate:
    needs: [authorize, prepare]
    if: >-
      always() && !cancelled() &&
      (needs.authorize.result == 'success' || needs.authorize.result == 'skipped') &&
      (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') &&
      (needs.prepare.outputs.publish == 'true' || github.event_name == 'pull_request' ||
       startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NPM_AUTO_RELEASE != 'true') ||
       (github.event_name == 'workflow_dispatch' && !inputs.publish))
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ref: ${{ steps.target.outputs.ref }}
      tag: ${{ steps.target.outputs.tag }}
      publish: ${{ needs.prepare.outputs.publish == 'true' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
      auto: ${{ needs.prepare.outputs.publish == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: node scripts/npm/version.mjs
      - id: target
        name: Fixar SHA e tag usados por todos os jobs
        shell: bash
        env:
          WILL_PUBLISH: ${{ needs.prepare.outputs.publish == 'true' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          node --input-type=module <<'JS'
          import { validate, run } from './scripts/npm/common.mjs';
          import { appendFileSync } from 'node:fs';
          appendFileSync(process.env.GITHUB_OUTPUT, `ref=${run('git', ['rev-parse', 'HEAD']).trim()}\ntag=v${validate()}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, process.env.WILL_PUBLISH === 'true'
            ? `Release v${validate()}: publicação condicionada aos gates e à autorização npm.\n`
            : 'Somente validação: nenhum pacote será publicado neste run. Para publicar, execute em main com publish=true e a automação ativada.\n');
          JS
      - name: Conferir tag antes de qualquer publicação
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/npm/version.mjs "$RELEASE_TAG"
      - id: matrix
        name: Usar catálogo único de plataformas
        run: |
          node --input-type=module <<'JS'
          import { platforms, binaryName } from './scripts/npm/common.mjs';
          import { appendFileSync } from 'node:fs';
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({include:platforms.map(p=>({...p,binary:binaryName(p.key)}))})}\n`);
          JS
      - run: node scripts/npm/pack.mjs main - release/main
      - uses: actions/upload-artifact@v4
        with:
          name: npm-main
          path: |
            release/main/*.tgz
            release/main/receipt.json
            release/main/SHA256SUMS
          if-no-files-found: error

  quality:
    needs: validate
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Instalar toolchain fixada
        run: |
          version=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$version"
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --test-threads=1
      - run: node --test scripts/npm/launcher.test.mjs scripts/npm/auto-release.test.mjs scripts/npm/trust.test.mjs

  build:
    needs: validate
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - name: Confirmar runner nativo
        env:
          EXPECTED_PLATFORM: ${{ matrix.key }}
        run: node -e "if (process.platform+'-'+process.arch !== process.env.EXPECTED_PLATFORM) process.exit(1)"
      - name: Instalar musl no Linux nativo
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
      - name: Instalar toolchain fixada e target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$version"
          rustup toolchain install "$version" --profile minimal
          rustup target add --toolchain "$version" "$TARGET"
      - run: cargo build --locked --release -p myagent-cli --target '${{ matrix.target }}'
      - name: Empacotar binário e conferir formato/arquitetura
        run: node scripts/npm/pack.mjs '${{ matrix.key }}' 'target/${{ matrix.target }}/release/${{ matrix.binary }}' 'release/${{ matrix.key }}'
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.key }}
          path: |
            release/${{ matrix.key }}/*.tgz
            release/${{ matrix.key }}/receipt.json
            release/${{ matrix.key }}/SHA256SUMS
          if-no-files-found: error

  smoke:
    needs: [validate, build]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: release
      - name: Conferir conjunto completo antes dos testes
        run: node scripts/npm/verify.mjs release --before-smoke
      - name: Instalar tarballs inéditos por registry local e executar fora do checkout
        run: node scripts/npm/smoke.mjs release '${{ matrix.key }}.smoke.json'
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.key }}
          path: '${{ matrix.key }}.smoke.json'
          if-no-files-found: error

  no-rust:
    needs: [validate, build]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    container: node:24-bookworm-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: release
      - name: Confirmar ausência de Rust na imagem
        run: |
          if command -v rustc || command -v cargo; then exit 1; fi
          node scripts/npm/verify.mjs release --before-smoke
          node scripts/npm/smoke.mjs release linux-container.smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-linux-container
          path: linux-container.smoke.json

  publish:
    needs: [validate, quality, smoke, no-rust]
    if: >-
      !cancelled() && needs.validate.result == 'success' &&
      needs.quality.result == 'success' && needs.smoke.result == 'success' &&
      needs.no-rust.result == 'success' && needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@v4
        with:
          path: release
      - run: node scripts/npm/verify.mjs release
      - name: Publicar plataformas, confirmar integridade/visibilidade e só então principal
        env:
          AUTO_RELEASE: ${{ needs.validate.outputs.auto }}
          NPM_AUTO_RELEASE: ${{ vars.NPM_AUTO_RELEASE }}
          REQUEST_PUBLISH: ${{ inputs.publish || false }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.ref }}
        run: node scripts/npm/publish.mjs --execute release

  github-release:
    needs: [validate, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Registrar release após confirmar todos os pacotes no npm
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) throw new Error('Invalid release tag');
            try {
              await github.rest.repos.getReleaseByTag({...context.repo, tag});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({...context.repo, tag_name: tag, name: tag, generate_release_notes: true});
            }
